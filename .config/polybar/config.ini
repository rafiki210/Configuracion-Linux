; ══════════════════════════════════════════════════════════════
;  Polybar — Warm Minimal
;  Copia a: ~/.config/polybar/config.ini
; ══════════════════════════════════════════════════════════════

[colors]
#fondo de barra
bg        = #F00E0B07    
bg-solid  = #0E0B07
surface   = #1A120A
copper    = #C8924A
copper-d  = #A06A2A
copper-b  = #E8C87A
text      = #D4B896
text-soft = #7A6448
text-dim  = #3D2E1E
urgent    = #8B3A2A
divider   = #3D2E1E

[bar/main]
width     = 100%
height    = 24
offset-y  = 0
radius    = 0

background = ${colors.bg}
foreground = ${colors.text}

; Línea inferior muy fina — el único "borde" visible
border-bottom-size  = 1
border-bottom-color = ${colors.surface}

; Separación interna
padding-left  = 1
padding-right = 2
module-margin = 0

; Fuentes
; Instala: sudo pacman -S ttf-dm-mono otf-cormorant ttf-font-awesome
font-0 = "DM Mono:style=Light:size=9;2"
font-1 = "DM Mono:style=Regular:size=9;2"
font-2 = "Font Awesome 6 Free:style=Solid:size=9;2"
font-3 = "Cormorant Garamond:style=Light Italic:size=10;3"
font-4 = "Symbols Nerd Font Mono:size=10;2"

modules-left   = i3 sep-thin cpu sep-thin memory sep-thin disk
modules-center = date
modules-right  = network sep-thin temperature sep-thin powermenu

; Tray a la derecha
tray-position   = right
tray-padding    = 6
tray-background = ${colors.bg-solid}
tray-maxsize    = 14

; Sin barra de desplazamiento del workspace
scroll-up   = i3wm-wsnext
scroll-down = i3wm-wsprev

; Cursor
cursor-click = pointer

; ── Módulos ─────────────────────────────────────────────────

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
pin-workspaces = true

label-focused            = %index%
label-focused-foreground = ${colors.copper-b}
label-focused-padding    = 3
label-focused-underline  = ${colors.copper-d}

label-unfocused            = %index%
label-unfocused-foreground = ${colors.text-dim}
label-unfocused-padding    = 3

label-urgent            = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding    = 3

label-visible            = %index%
label-visible-foreground = ${colors.text-soft}
label-visible-padding    = 3

label-mode            = " %mode% "
label-mode-foreground = ${colors.copper}
label-mode-background = ${colors.surface}

[module/sep-thin]
type    = custom/text
content = "  ·  "
content-foreground = ${colors.text-dim}

[module/cpu]
type     = internal/cpu
interval = 2

format         = <label>
format-prefix  = "cpu "
format-prefix-foreground = ${colors.text-dim}

label            = %percentage%%
label-foreground = ${colors.text-soft}

; Aviso si supera 85%
format-warn         = <label-warn>
format-warn-prefix  = "cpu "
format-warn-prefix-foreground = ${colors.urgent}
label-warn          = %percentage%%
label-warn-foreground = ${colors.urgent}
warn-percentage     = 85

[module/memory]
type     = internal/memory
interval = 3

format        = <label>
format-prefix = "mem "
format-prefix-foreground = ${colors.text-dim}

label            = %percentage_used%%
label-foreground = ${colors.text-soft}

[module/disk]
type     = internal/fs
mount-0  = /
interval = 30

format-mounted        = <label-mounted>
format-mounted-prefix = "disk "
format-mounted-prefix-foreground = ${colors.text-dim}

label-mounted            = %percentage_used%%
label-mounted-foreground = ${colors.text-soft}

[module/date]
type     = internal/date
interval = 1

; Hora en copper-b, fecha en text-soft — usa font-3 (Cormorant) para la fecha
date      = %A, %d %B
time      = %H:%M

; Formato compuesto: fecha · hora
format = <label>
label  = %date%  %time%
label-font       = 3
label-foreground = ${colors.text-soft}

; Al hacer click muestra segundos
date-alt = %Y-%m-%d
time-alt = %H:%M:%S

[module/network]
type      = internal/network
; ── IMPORTANTE: cambia esto por tu interfaz (ip link) ──────
interface = eno1
; Para wifi usa algo como: wlan0 o wlp3s0
interval  = 3

format-connected        = <label-connected>
format-connected-prefix = "net "
format-connected-prefix-foreground = ${colors.text-dim}
label-connected            = %upspeed% ↑  %downspeed% ↓
label-connected-foreground = ${colors.text-soft}

format-disconnected        = <label-disconnected>
label-disconnected         = "sin red"
label-disconnected-foreground = ${colors.text-dim}

[module/temperature]
type          = internal/temperature
interval      = 4
thermal-zone  = 0
warn-temperature = 75

format         = <label>
format-prefix  = "temp "
format-prefix-foreground = ${colors.text-dim}
label            = %temperature-c%
label-foreground = ${colors.text-soft}

format-warn        = <label-warn>
label-warn         = %temperature-c%
label-warn-foreground = ${colors.urgent}

[module/battery]
type          = internal/battery
battery       = BAT0
adapter       = AC
full-at       = 99
poll-interval = 10

format-charging            = <label-charging>
format-charging-prefix     = "bat "
format-charging-prefix-foreground = ${colors.text-dim}
label-charging             = %percentage%% ↑
label-charging-foreground  = ${colors.text-soft}

format-discharging         = <label-discharging>
format-discharging-prefix  = "bat "
format-discharging-prefix-foreground = ${colors.text-dim}
label-discharging          = %percentage%%
label-discharging-foreground = ${colors.text-soft}

format-full        = <label-full>
label-full         = "completa"
label-full-foreground = ${colors.text-dim}

[module/powermenu]
type = custom/menu

format-spacing = 1

label-open            = "⏻"
label-open-foreground = ${colors.text-dim}
label-close           = "cancelar"
label-close-foreground = ${colors.text-dim}
label-separator       = " · "
label-separator-foreground = ${colors.text-dim}

menu-0-0 = "suspender"
menu-0-0-foreground = ${colors.text-soft}
menu-0-0-exec = systemctl suspend

menu-0-1 = "reiniciar"
menu-0-1-foreground = ${colors.text-soft}
menu-0-1-exec = systemctl reboot

menu-0-2 = "apagar"
menu-0-2-foreground = ${colors.urgent}
menu-0-2-exec = systemctl poweroff
